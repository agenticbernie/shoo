# Shoo local development stack (profile `core` from docs/65).
#
# Production PostgreSQL is managed and is NOT deployed from this file.
# `docker compose up -d postgres` gives you an operational database with the
# pgvector extension available; `pnpm db:migrate` applies migrations/postgres.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoo_migrator
      POSTGRES_PASSWORD: shoo_dev_password
      POSTGRES_DB: shoo
      # Deterministic collation so migration/test ordering is reproducible.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
    ports:
      - "${SHOO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - shoo-postgres-data:/var/lib/postgresql/data
      - ./tooling/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoo_migrator -d shoo"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  shoo-postgres-data:
